name: hadirin_staff_app
description: Hadir-In Staff Attendance App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  intl: ^0.18.1
  intl_utils: ^2.8.5
  shared_preferences: ^2.2.0
  # Sprint 3 EPIC 5a: token JWT & staffId TIDAK boleh lagi di SharedPreferences
  # plaintext — dipindah ke keystore/keychain terenkripsi OS lewat paket ini.
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  percent_indicator: ^4.2.3
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.11.0
  pdf: ^3.10.8
  printing: ^5.12.0
  # Fase 8: pengecekan lokasi GPS nyata untuk check-in/check-out
  # (menggantikan Random().nextBool() di home_tab.dart).
  geolocator: ^13.0.2
  # Fase 8: pilih file/foto untuk upload dokumen onboarding
  # (pas foto / KTP / BPJS / NPWP).
  image_picker: ^1.1.2
  # Sprint 2 OTP/auth overhaul: buka WhatsApp/dialer dari kartu "Hubungi Admin".
  url_launcher: ^6.3.1
  # Notifikasi NYATA di status bar HP (bukan sekadar daftar di dalam app).
  # Dipakai NotificationCenter untuk memunculkan setiap notifikasi backend +
  # peringatan lokal (batas lembur, lupa break-out/check-out).
  flutter_local_notifications: ^17.2.3
  # Menyimpan berkas dokumen yang DIPILIH tapi BELUM diajukan ke folder
  # privat app, supaya draft-nya bertahan walau app ditutup.
  path_provider: ^2.1.4
  # Push NYATA lewat Firebase Cloud Messaging: notifikasi tetap sampai walau
  # app di-background atau ditutup -- sesuatu yang polling 45 detik di
  # MainScreen tidak bisa lakukan (polling hanya jalan saat app dibuka).
  # firebase_core wajib ikut: ia yang membaca android/app/google-services.json
  # (di-gitignore, minta ke pemilik project) dan menyalakan Firebase.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_hadir_in.png
    - assets/images/logo_hadir_in_dengan_tulisan.png
    - assets/images/maskot_hadir_in.png
    - assets/images/maskot_hadir_in_melambai.png